services:
  - type: web
    name: pulseguard-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: PulseGuard AI - Health Monitoring & Anomaly Detection System
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///./health_monitoring.db
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_KEY
        value: ""
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ""
      - key: SUPABASE_DB_URL
        value: ""
      - key: SUPABASE_SYNC_ENABLED
        value: "False"
      - key: SUPABASE_AUTO_SYNC
        value: "False"
    healthCheckPath: /
